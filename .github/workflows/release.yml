name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab && /^\[[^]]+\]:/ { exit }
            grab { print }
          ' CHANGELOG.md \
            | sed '/./,$!d' \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' \
            > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md section for $GITHUB_REF_NAME — aborting" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/smnspz-limitedrun-theme-${version}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
