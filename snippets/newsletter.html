{% comment %} Native Limited Run mailing list. Posts email to newsletters.limitedrun.com/subscribe; LR opens a confirmation tab. {% endcomment %}
<form class="newsletter" action="//newsletters.limitedrun.com/subscribe?store={{ store.subdomain }}" method="post" target="_blank">
  <label class="newsletter__label" for="newsletter-email">Iscriviti alla newsletter</label>
  <div class="newsletter__row">
    <input class="newsletter__input" type="email" id="newsletter-email" name="email" placeholder="ciao@bello.it" required>
    <button class="newsletter__submit" type="submit">Iscriviti</button>
  </div>
  <p class="newsletter__hint">Aggiornamenti sporadici su nuove uscite e drop.</p>
</form>
